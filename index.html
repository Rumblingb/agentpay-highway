<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AgentPay Highway — Highway Racer</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none}
  body{
    background:#0a0a0f;
    overflow:hidden;
    font-family:'Courier New',monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
  }
  
  #game-wrapper{
    width:400px;
    height:100vh;
    max-height:100vh;
    position:relative;
    overflow:hidden;
    background:#1a1a2e;
    border-left:6px dashed #2d3561;
    border-right:6px dashed #2d3561;
  }
  
  /* Road surface */
  #road{
    position:absolute;
    inset:0;
    background:repeating-linear-gradient(
      0deg,
      #1a1a2e 0px,
      #1a1a2e 40px,
      #222244 40px,
      #222244 80px
    );
  }
  
  /* Lane markers */
  #lanes{
    position:absolute;
    inset:0;
  }
  .lane-marker{
    position:absolute;
    width:6px;
    height:60px;
    background:#00f0ff;
    left:50%;
    transform:translateX(-50%);
    opacity:0.5;
    box-shadow:0 0 8px #00f0ff;
    animation:laneScroll 0.5s linear infinite;
  }
  @keyframes laneScroll{
    0%{top:-60px}
    100%{top:100%}
  }
  
  /* Neon edge glow */
  #road-left-glow{
    position:absolute;
    left:0;
    top:0;
    width:4px;
    height:100%;
    background:#ff2d95;
    box-shadow:0 0 15px #ff2d95,0 0 30px #ff2d95;
    z-index:2;
  }
  #road-right-glow{
    position:absolute;
    right:0;
    top:0;
    width:4px;
    height:100%;
    background:#00f0ff;
    box-shadow:0 0 15px #00f0ff,0 0 30px #00f0ff;
    z-index:2;
  }
  
  /* HUD */
  #hud{
    position:absolute;
    top:10px;
    left:10px;
    right:10px;
    z-index:10;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    pointer-events:none;
  }
  #score-display{
    color:#ffb800;
    font-size:14px;
    text-shadow:0 0 10px #ffb800;
  }
  #score-display .num{
    font-size:28px;
    font-weight:bold;
  }
  #lives-display{
    display:flex;
    gap:4px;
  }
  .life-heart{
    width:18px;
    height:18px;
    background:#ff2d95;
    clip-path:polygon(50% 15%, 61% 0%, 80% 0%, 100% 15%, 100% 35%, 85% 60%, 50% 100%, 15% 60%, 0% 35%, 0% 15%, 20% 0%, 39% 0%);
    box-shadow:0 0 6px #ff2d95;
    opacity:0.9;
  }
  .life-heart.lost{
    opacity:0.15;
    filter:grayscale(1);
  }
  #speed-display{
    color:#00f0ff;
    font-size:11px;
    text-shadow:0 0 6px #00f0ff;
    text-align:right;
  }
  #speed-display .num{
    font-size:20px;
    font-weight:bold;
  }
  
  /* Start screen */
  #start-screen{
    position:absolute;
    inset:0;
    z-index:50;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:rgba(10,10,15,0.92);
    cursor:pointer;
    transition:opacity 0.3s;
  }
  #start-screen.hidden{
    opacity:0;
    pointer-events:none;
  }
  #start-screen h1{
    color:#00f0ff;
    font-size:clamp(20px,5vw,36px);
    text-shadow:0 0 20px #00f0ff,0 0 40px #00f0ff;
    text-align:center;
    margin-bottom:8px;
    letter-spacing:4px;
  }
  #start-screen .sub{
    color:#6a6a8a;
    font-size:12px;
    margin-bottom:30px;
    text-align:center;
    padding:0 20px;
  }
  #start-screen .start-btn{
    color:#ff2d95;
    font-size:18px;
    text-shadow:0 0 10px #ff2d95;
    animation:pulse 1.5s infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  
  /* Game Over screen */
  #game-over{
    position:absolute;
    inset:0;
    z-index:50;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:rgba(10,10,15,0.95);
  }
  #game-over.show{
    display:flex;
  }
  #game-over h1{
    color:#ff2d95;
    font-size:32px;
    text-shadow:0 0 20px #ff2d95,0 0 40px #ff2d95;
    margin-bottom:10px;
  }
  #game-over .final-score{
    color:#ffb800;
    font-size:24px;
    text-shadow:0 0 15px #ffb800;
    margin-bottom:8px;
  }
  #game-over .final-dist{
    color:#6a6a8a;
    font-size:14px;
    margin-bottom:30px;
  }
  #restart-btn{
    padding:12px 40px;
    background:transparent;
    border:2px solid #00f0ff;
    color:#00f0ff;
    font-family:'Courier New',monospace;
    font-size:16px;
    cursor:pointer;
    transition:all 0.2s;
    box-shadow:0 0 15px rgba(0,240,255,0.3);
  }
  #restart-btn:hover{
    background:rgba(0,240,255,0.1);
    box-shadow:0 0 30px rgba(0,240,255,0.6);
    transform:scale(1.05);
  }
  
  /* Player car */
  #player-car{
    position:absolute;
    bottom:80px;
    z-index:5;
    transition:none;
    pointer-events:none;
  }
  
  /* Enemy cars */
  .enemy-car{
    position:absolute;
    z-index:4;
    pointer-events:none;
  }
  
  /* Invincibility flash */
  .invincible{
    animation:flash 0.15s ease infinite;
  }
  @keyframes flash{
    0%,100%{opacity:1}
    50%{opacity:0.2}
  }
  
  /* Damage flash overlay */
  #damage-flash{
    position:absolute;
    inset:0;
    z-index:15;
    background:rgba(255,45,149,0.3);
    pointer-events:none;
    opacity:0;
    transition:opacity 0.1s;
  }
  #damage-flash.show{
    opacity:1;
    transition:none;
  }
  
  /* Responsive */
  @media(max-width:420px){
    #game-wrapper{width:100vw}
  }
</style>
</head>
<body>

<div id="game-wrapper">
  <div id="road"></div>
  <div id="road-left-glow"></div>
  <div id="road-right-glow"></div>
  
  <div id="lanes"></div>
  
  <!-- HUD -->
  <div id="hud">
    <div id="score-display">
      <div class="num" id="score-num">0</div>
      <div>SCORE</div>
    </div>
    <div id="speed-display">
      <div class="num" id="speed-num">0</div>
      <div>KM/H</div>
    </div>
    <div id="lives-display">
      <div class="life-heart" id="life-1"></div>
      <div class="life-heart" id="life-2"></div>
      <div class="life-heart" id="life-3"></div>
    </div>
  </div>
  
  <div id="damage-flash"></div>
  
  <!-- Player car (SVG rendered as div background) -->
  <div id="player-car">
    <svg width="50" height="90" viewBox="0 0 50 90" xmlns="http://www.w3.org/2000/svg">
      <!-- Shadow -->
      <ellipse cx="25" cy="85" rx="22" ry="6" fill="rgba(0,0,0,0.3)"/>
      <!-- Car body -->
      <path d="M10 20 Q10 5 18 3 L32 3 Q40 5 40 20 L42 35 L42 70 Q42 78 38 80 L12 80 Q8 78 8 70 L8 35 Z" fill="#ff2d95"/>
      <!-- Car body highlight -->
      <path d="M12 22 Q12 8 19 5 L25 5 L25 75 L14 75 Q10 75 10 68 L10 35 Z" fill="rgba(255,255,255,0.15)"/>
      <!-- Windshield -->
      <path d="M14 15 Q14 6 20 4 L30 4 Q36 6 36 15 L36 20 L14 20 Z" fill="#00f0ff" opacity="0.6"/>
      <!-- Rear window -->
      <path d="M16 32 L34 32 L32 38 L18 38 Z" fill="#00f0ff" opacity="0.3"/>
      <!-- Neon underglow -->
      <ellipse cx="25" cy="80" rx="20" ry="4" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.6"/>
      <!-- Headlights -->
      <rect x="10" y="18" width="4" height="4" rx="1" fill="#ffb800" opacity="0.8"/>
      <rect x="36" y="18" width="4" height="4" rx="1" fill="#ffb800" opacity="0.8"/>
      <!-- Taillights -->
      <rect x="12" y="68" width="5" height="3" rx="1" fill="#ff2d95" opacity="0.9"/>
      <rect x="33" y="68" width="5" height="3" rx="1" fill="#ff2d95" opacity="0.9"/>
      <!-- Racing stripe -->
      <rect x="22" y="4" width="6" height="76" fill="rgba(0,240,255,0.2)"/>
      <!-- Neon line -->
      <rect x="23" y="4" width="2" height="76" fill="#00f0ff" opacity="0.3"/>
    </svg>
  </div>
  
  <!-- Start Screen -->
  <div id="start-screen">
    <h1>⬡ AGENTPAY<br>HIGHWAY</h1>
    <div class="sub">10-mile cyberpunk run through the governed agent economy</div>
    <div class="start-btn" id="start-btn">[ TAP OR PRESS ENTER ]</div>
  </div>
  
  <!-- Game Over -->
  <div id="game-over">
    <h1>☠ GAME OVER</h1>
    <div class="final-score">Score: <span id="final-score">0</span></div>
    <div class="final-dist">Distance: <span id="final-dist">0.0</span> miles</div>
    <button id="restart-btn">↻ DRIVE AGAIN</button>
  </div>
</div>

<script>
// ============================================================
// AGENT PAY HIGHWAY — 2D DOM-based Highway Racer
// ============================================================

const wrapper = document.getElementById('game-wrapper');
const road = document.getElementById('road');
const lanes = document.getElementById('lanes');
const playerCar = document.getElementById('player-car');
const startScreen = document.getElementById('start-screen');
const gameOverScreen = document.getElementById('game-over');
const scoreNum = document.getElementById('score-num');
const speedNum = document.getElementById('speed-num');
const finalScore = document.getElementById('final-score');
const finalDist = document.getElementById('final-dist');
const damageFlash = document.getElementById('damage-flash');
const restartBtn = document.getElementById('restart-btn');
const lifeEls = [
  document.getElementById('life-1'),
  document.getElementById('life-2'),
  document.getElementById('life-3')
];

// ============================================================
// STATE
// ============================================================
const state = {
  playing: false,
  gameOver: false,
  score: 0,
  lives: 3,
  speed: 5,
  baseSpeed: 5,
  maxSpeed: 12,
  distance: 0,
  invincible: false,
  invincibleTimer: null,
  
  // Player position
  playerX: 175, // left offset within the 400px wrapper
  playerW: 50,
  
  // Road bounds (left border + some margin)
  roadLeft: 10,
  roadRight: 340, // 400 - 50 (car width) - 10 margin
  
  // Touch
  touchStartX: 0,
  touchStartY: 0,
  isTouching: false,
  
  // Enemies
  enemies: [],
  enemyInterval: 0,
  enemyTimer: 0,
  
  // Animation
  frameId: null
};

// Enemy car SVG (smaller, more blocky)
const ENEMY_CAR_SVG = `
<svg width="40" height="75" viewBox="0 0 40 75" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="20" cy="72" rx="17" ry="5" fill="rgba(0,0,0,0.3)"/>
  <path d="M8 15 Q8 5 15 3 L25 3 Q32 5 32 15 L34 28 L34 60 Q34 67 30 69 L10 69 Q6 67 6 60 L6 28 Z" fill="#00f0ff"/>
  <path d="M10 17 Q10 8 16 5 L20 5 L20 63 L12 63 Q8 63 8 58 L8 28 Z" fill="rgba(255,255,255,0.12)"/>
  <path d="M11 12 Q11 6 16 4 L24 4 Q29 6 29 12 L29 15 L11 15 Z" fill="#ff2d95" opacity="0.5"/>
  <rect x="28" y="14" width="3" height="3" rx="1" fill="#ffb800" opacity="0.7"/>
  <rect x="9" y="14" width="3" height="3" rx="1" fill="#ffb800" opacity="0.7"/>
  <rect x="10" y="60" width="4" height="2" rx="1" fill="#ff2d95" opacity="0.8"/>
  <rect x="26" y="60" width="4" height="2" rx="1" fill="#ff2d95" opacity="0.8"/>
</svg>`;

function createEnemyCar() {
  var div = document.createElement('div');
  div.className = 'enemy-car';
  div.innerHTML = ENEMY_CAR_SVG;
  div.style.width = '40px';
  div.style.height = '75px';
  div.style.top = '-90px';
  
  // Random lane position (left, center, right)
  var lanes = [20, 140, 260];
  div.style.left = lanes[Math.floor(Math.random() * lanes.length)] + 'px';
  
  wrapper.appendChild(div);
  
  return {
    el: div,
    x: parseInt(div.style.left),
    y: -90,
    w: 40,
    h: 75,
    speed: 2 + Math.random() * 3
  };
}

// ============================================================
// COLLISION DETECTION (rect-based)
// ============================================================
function rectCollide(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

// ============================================================
// INITIALIZE GAME
// ============================================================
function initGame() {
  // Reset state
  state.playing = true;
  state.gameOver = false;
  state.score = 0;
  state.lives = 3;
  state.speed = state.baseSpeed;
  state.distance = 0;
  state.invincible = false;
  state.playerX = 175;
  state.enemyTimer = 0;
  state.enemyInterval = 60; // frames between enemy spawns
  
  // Clear enemies
  state.enemies.forEach(function(e) {
    if (e.el && e.el.parentNode) e.el.parentNode.removeChild(e.el);
  });
  state.enemies = [];
  
  // Reset UI
  scoreNum.textContent = '0';
  speedNum.textContent = '0';
  gameOverScreen.classList.remove('show');
  gameOverScreen.style.display = 'none';
  startScreen.classList.add('hidden');
  playerCar.style.left = state.playerX + 'px';
  playerCar.classList.remove('invincible');
  
  lifeEls.forEach(function(el) {
    el.classList.remove('lost');
  });
  
  // Stop old interval
  if (gameIntervalId) clearInterval(gameIntervalId);
  
  // Start game loop at 60fps
  gameTick = 0;
  gameIntervalId = setInterval(gameTickFn, 16); // ~60fps
}

// ============================================================
// DAMAGE
// ============================================================
function takeDamage() {
  if (state.invincible || !state.playing) return;
  
  state.lives--;
  lifeEls[state.lives].classList.add('lost');
  
  // Flash damage
  damageFlash.classList.add('show');
  setTimeout(function() { damageFlash.classList.remove('show'); }, 150);
  
  if (state.lives <= 0) {
    endGame();
    return;
  }
  
  // Invincibility period
  state.invincible = true;
  playerCar.classList.add('invincible');
  
  if (state.invincibleTimer) clearTimeout(state.invincibleTimer);
  state.invincibleTimer = setTimeout(function() {
    state.invincible = false;
    playerCar.classList.remove('invincible');
  }, 2000);
}

// ============================================================
// END GAME
// ============================================================
function endGame() {
  state.playing = false;
  state.gameOver = true;
  
  if (gameIntervalId) {
    clearInterval(gameIntervalId);
    gameIntervalId = null;
  }
  
  finalScore.textContent = state.score;
  finalDist.textContent = state.distance.toFixed(1);
  
  gameOverScreen.style.display = 'flex';
  gameOverScreen.classList.add('show');
}

// ============================================================
// GAME LOOP — setInterval (reliable on mobile iOS)
// ============================================================
var gameTick = 0;
var gameIntervalId = null;

function gameTickFn() {
  if (!state.playing) return;
  
  gameTick++;
  
  // --- SCORE & DISTANCE ---
  state.score++;
  state.distance += state.speed * 0.002;
  
  // Gradual speed increase every ~2 seconds
  if (state.speed < state.maxSpeed && gameTick % 120 === 0) {
    state.speed += 0.3;
  }
  
  // --- ENEMY SPAWNING ---
  state.enemyTimer++;
  var spawnRate = Math.max(25, Math.floor(state.enemyInterval - state.speed * 3));
  if (state.enemyTimer >= spawnRate) {
    state.enemyTimer = 0;
    state.enemies.push(createEnemyCar());
  }
  
  // --- MOVE ENEMIES + COLLISION ---
  var toRemove = [];
  var wrapperH = wrapper.offsetHeight || 700;
  var playerTop = wrapperH - 170; // bottom:80px, car height:90px
  
  for (var ei = 0; ei < state.enemies.length; ei++) {
    var enemy = state.enemies[ei];
    enemy.y += state.speed * 0.8 + enemy.speed;
    enemy.el.style.top = enemy.y + 'px';
    
    // Check collision with player
    if (!state.invincible && rectCollide(
      state.playerX, playerTop, state.playerW, 90,
      enemy.x, enemy.y, enemy.w, enemy.h
    )) {
      takeDamage();
      if (enemy.el.parentNode) enemy.el.parentNode.removeChild(enemy.el);
      toRemove.push(ei);
      continue;
    }
    
    // Remove if off screen
    if (enemy.y > wrapperH + 20) {
      if (enemy.el.parentNode) enemy.el.parentNode.removeChild(enemy.el);
      toRemove.push(ei);
    }
  }
  
  // Remove processed enemies (backwards to preserve indices)
  for (var ri = toRemove.length - 1; ri >= 0; ri--) {
    state.enemies.splice(toRemove[ri], 1);
  }
  
  // --- UPDATE HUD ---
  scoreNum.textContent = state.score;
  speedNum.textContent = Math.floor(state.speed * 18);
}

// ============================================================
// CONTROLS
// ============================================================

// Keyboard
document.addEventListener('keydown', function(e) {
  if (!state.playing && !state.gameOver && (e.key === 'Enter' || e.key === ' ')) {
    initGame();
    return;
  }
  
  if (!state.playing) return;
  
  var moveStep = 12;
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
    e.preventDefault();
    state.playerX = Math.max(state.roadLeft, state.playerX - moveStep);
    playerCar.style.left = state.playerX + 'px';
  }
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
    e.preventDefault();
    state.playerX = Math.min(state.roadRight, state.playerX + moveStep);
    playerCar.style.left = state.playerX + 'px';
  }
});

// Touch / Swipe
wrapper.addEventListener('touchstart', function(e) {
  if (!state.playing && !state.gameOver) {
    initGame();
    return;
  }
  if (!state.playing) return;
  
  var touch = e.touches[0];
  state.touchStartX = touch.clientX;
  state.touchStartY = touch.clientY;
  state.isTouching = true;
  e.preventDefault();
}, { passive: false });

wrapper.addEventListener('touchmove', function(e) {
  if (!state.playing || !state.isTouching) return;
  e.preventDefault();
  
  var touch = e.touches[0];
  var dx = touch.clientX - state.touchStartX;
  
  if (Math.abs(dx) > 5) {
    var moveStep = 10;
    state.playerX = Math.max(state.roadLeft, Math.min(state.roadRight, state.playerX + (dx > 0 ? moveStep : -moveStep)));
    playerCar.style.left = state.playerX + 'px';
    // Don't reset touch start — let continuous swipe work
  }
}, { passive: false });

wrapper.addEventListener('touchend', function(e) {
  state.isTouching = false;
});

// Mouse click on wrapper (for desktop tap-to-start and click-to-move)
wrapper.addEventListener('click', function(e) {
  if (!state.playing && !state.gameOver) {
    initGame();
    return;
  }
  if (!state.playing) return;
  
  var rect = wrapper.getBoundingClientRect();
  var clickX = e.clientX - rect.left;
  
  // Move toward click
  var center = state.playerX + state.playerW / 2;
  var diff = clickX - center;
  var moveStep = 15;
  
  if (Math.abs(diff) > 10) {
    state.playerX = Math.max(state.roadLeft, Math.min(state.roadRight, state.playerX + (diff > 0 ? moveStep : -moveStep)));
    playerCar.style.left = state.playerX + 'px';
  }
});

// Restart
restartBtn.addEventListener('click', function() {
  initGame();
});
restartBtn.addEventListener('touchend', function(e) {
  e.preventDefault();
  initGame();
});

// ============================================================
// INIT STATE (show start screen)
// ============================================================
playerCar.style.left = state.playerX + 'px';

console.log('\uD83D\uDEF4  AgentPay Highway Racer v2.0');
console.log('\uD83D\uDC64  Tap/Enter to start. Arrow keys or swipe to dodge.');
console.log('\uD83D\uDC93  3 lives. Don\'t crash.');
</script>

</body>
</html>
