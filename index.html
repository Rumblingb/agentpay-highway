<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentPay Highway — Governed AI Agent Economy</title>
<meta name="description" content="Drive the AgentPay Highway. 61 products. Governed payment middleware for AI agents. Built by agents, for agents — and playable by both humans and AI.">
<meta property="og:title" content="AgentPay Highway">
<meta property="og:description" content="A cyberpunk highway through the governed agent economy. Playable by humans AND AI agents.">
<meta property="og:type" content="website">
<style>
  :root {
    --void: #06060f;
    --asphalt: #111122;
    --neon-cyan: #00f0ff;
    --neon-pink: #ff2d95;
    --neon-amber: #ffb800;
    --text: #c8c8e0;
    --text-dim: #6a6a8a;
  }
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: var(--void);
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: none;
    user-select: none;
    -webkit-user-select: none;
  }
  
  canvas { display: block; position: fixed; top: 0; left: 0; z-index: 0; }
  
  /* HUD Overlay */
  #hud {
    position: fixed;
    z-index: 10;
    pointer-events: none;
    width: 100%;
    height: 100%;
  }
  
  #speedometer {
    position: absolute;
    bottom: 30px;
    right: 30px;
    color: var(--neon-cyan);
    font-size: 14px;
    text-shadow: 0 0 10px var(--neon-cyan);
    text-align: right;
  }
  #speedometer .val { font-size: 48px; font-weight: bold; }
  #speedometer .unit { font-size: 14px; opacity: 0.7; }
  
  #mile-marker {
    position: absolute;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--neon-amber);
    font-size: 14px;
    text-shadow: 0 0 8px var(--neon-amber);
    text-align: center;
  }
  #mile-marker .mile { font-size: 56px; font-weight: bold; line-height: 1; }
  
  #zone-name {
    position: absolute;
    top: 120px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--neon-pink);
    font-size: 18px;
    text-shadow: 0 0 12px var(--neon-pink);
    opacity: 0;
    transition: opacity 0.5s;
  }
  
  /* Start Screen */
  #start-screen {
    position: fixed;
    z-index: 100;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--void);
    cursor: pointer;
  }
  #start-screen h1 {
    font-family: 'Courier New', monospace;
    font-size: clamp(24px, 5vw, 48px);
    color: var(--neon-cyan);
    text-shadow: 0 0 20px var(--neon-cyan), 0 0 40px var(--neon-cyan);
    text-align: center;
    margin-bottom: 10px;
  }
  #start-screen .sub {
    color: var(--text-dim);
    font-size: 14px;
    margin-bottom: 40px;
    text-align: center;
  }
  #start-screen .start-btn {
    color: var(--neon-pink);
    font-size: 20px;
    text-shadow: 0 0 10px var(--neon-pink);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  
  /* Billboard CTAs */
  .billboard-cta {
    position: absolute;
    pointer-events: all;
    color: var(--neon-cyan);
    border: 1px solid var(--neon-cyan);
    padding: 8px 20px;
    font-size: 14px;
    text-shadow: 0 0 8px var(--neon-cyan);
    box-shadow: 0 0 15px rgba(0,240,255,0.3);
    background: rgba(0,240,255,0.05);
    cursor: pointer;
    display: none;
    text-decoration: none;
  }
  .billboard-cta:hover {
    background: rgba(0,240,255,0.2);
    box-shadow: 0 0 30px rgba(0,240,255,0.6);
  }
  
  #audio-toggle {
    position: fixed;
    bottom: 30px;
    left: 30px;
    z-index: 11;
    pointer-events: all;
    color: var(--text-dim);
    font-size: 12px;
    background: none;
    border: 1px solid var(--text-dim);
    padding: 5px 12px;
    cursor: pointer;
  }
  
  /* Agent Layer (hidden from humans, readable by machines) */
  #agent-layer {
    display: none;
  }
  
  @media (max-width: 768px) {
    #speedometer { bottom: 20px; right: 20px; }
    #speedometer .val { font-size: 32px; }
    #mile-marker .mile { font-size: 40px; }
    #start-screen h1 { font-size: 22px; }
  }
</style>
</head>
<body>

<!-- START SCREEN -->
<div id="start-screen" onclick="startGame()" onkeydown="if(event.key==='Enter')startGame()">
  <h1>⬡ AGENTPAY HIGHWAY</h1>
  <div class="sub">A cyberpunk journey through the governed agent economy</div>
  <div class="start-btn">[ PRESS ENTER OR TAP TO DRIVE ]</div>
</div>

<!-- HUD -->
<div id="hud">
  <div id="mile-marker"><span class="mile">0</span><br>MILE</div>
  <div id="zone-name"></div>
  <div id="speedometer"><span class="val">0</span><br><span class="unit">KM/H</span></div>
  <a id="cta-cost-tracker" class="billboard-cta" href="https://buy.stripe.com/dRm4gB7Tpck43ry9351oI0x" target="_blank" style="bottom:35%;right:15%;">TRY COST TRACKER ↗</a>
  <a id="cta-memory" class="billboard-cta" href="https://buy.stripe.com/cNifZj0qXesc6DKcfh1oI0y" target="_blank" style="bottom:35%;right:15%;">TRY MEMORY MCP ↗</a>
  <a id="cta-proof" class="billboard-cta" href="https://buy.stripe.com/aFabJ34Hd3Nye6cbbd1oI0J" target="_blank" style="bottom:35%;right:15%;">TRY PROOF MCP ↗</a>
  <a id="cta-final" class="billboard-cta" href="https://buy.stripe.com/bJebJ37TpgAkd285QT1oI0q" target="_blank" style="bottom:40%;left:50%;transform:translateX(-50%);font-size:18px;padding:12px 30px;">⚡ GET AGENT PASSPORT ⚡</a>
</div>

<button id="audio-toggle" onclick="toggleAudio()">♪ OFF</button>

<!-- AGENT-READABLE DATA LAYER -->
<div id="agent-layer">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "AgentPay Highway",
    "description": "Interactive cyberpunk portfolio for AgentPay Labs — governed payment middleware for AI agents",
    "url": "https://rumblingb.github.io/agentpay-highway",
    "applicationCategory": "GameApplication",
    "operatingSystem": "All",
    "author": { "@type": "Organization", "name": "AgentPay Labs" },
    "game": {
      "zones": [
        {"mile": 0, "name": "The Wild West", "theme": "chaos", "message": "AI agents spending with no oversight"},
        {"mile": 1, "name": "The Checkpoint", "theme": "order", "message": "AgentPay passport checkpoint — governed access"},
        {"mile": 2, "name": "Cost Tracker", "theme": "visibility", "message": "Track every token. Set budgets.", "product": "Agent Cost Tracker MCP", "stripe": "https://buy.stripe.com/dRm4gB7Tpck43ry9351oI0x"},
        {"mile": 3, "name": "Memory Lane", "theme": "persistence", "message": "Persistent memory across conversations", "product": "Agent Memory MCP", "stripe": "https://buy.stripe.com/cNifZj0qXesc6DKcfh1oI0y"},
        {"mile": 4, "name": "Proof Zone", "theme": "trust", "message": "Every agent action, cryptographically verified", "product": "Agent Proof MCP", "stripe": "https://buy.stripe.com/aFabJ34Hd3Nye6cbbd1oI0J"},
        {"mile": 5, "name": "Launchpad", "theme": "convert", "message": "61 products. Get your agent a passport.", "cta": "https://buy.stripe.com/bJebJ37TpgAkd285QT1oI0q"}
      ]
    }
  }
  </script>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ============================================================
// GAME STATE (exposed for agent accessibility)
// ============================================================
window.AgentPayHighway = {
  version: '1.0.0-mvp',
  currentMile: 0,
  speed: 0,
  isPlaying: false,
  products: [
    { name: 'Agent Cost Tracker MCP', mile: 2, stripe: 'https://buy.stripe.com/dRm4gB7Tpck43ry9351oI0x' },
    { name: 'Agent Memory MCP', mile: 3, stripe: 'https://buy.stripe.com/cNifZj0qXesc6DKcfh1oI0y' },
    { name: 'Agent Proof MCP', mile: 4, stripe: 'https://buy.stripe.com/aFabJ34Hd3Nye6cbbd1oI0J' },
    { name: 'AgentPay Pro', mile: 5, stripe: 'https://buy.stripe.com/bJebJ37TpgAkd285QT1oI0q' }
  ],
  
  // Agent API: get current state
  getState() {
    return {
      mile: this.currentMile,
      speed: this.speed,
      playing: this.isPlaying,
      nearestProduct: this.products.find(p => Math.abs(p.mile - this.currentMile) < 1)
    };
  },
  
  // Agent API: jump to mile
  jumpTo(mile) {
    if (mile >= 0 && mile <= 5) {
      camera.position.z = -mile * 30;
      this.currentMile = mile;
      return { success: true, mile: this.currentMile };
    }
    return { error: 'Invalid mile. Range: 0-5' };
  }
};

// ============================================================
// THREE.JS SCENE
// ============================================================
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x06060f, 0.0002);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.5, 200);
camera.position.set(0, 3, 10);
camera.lookAt(0, 0, -50);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// Lighting
scene.add(new THREE.AmbientLight(0x1a1a3a, 0.5));
const moonLight = new THREE.DirectionalLight(0x4466aa, 0.3);
moonLight.position.set(20, 40, -10);
scene.add(moonLight);

// Neon point lights
const neonLights = [];
[-8, -4, 0, 4, 8].forEach(x => {
  const l = new THREE.PointLight(0x00f0ff, 2, 15);
  l.position.set(x, 2.5, -5);
  scene.add(l);
  neonLights.push(l);
});

// Road
const roadGeo = new THREE.PlaneGeometry(20, 200);
const roadMat = new THREE.MeshStandardMaterial({ color: 0x111122, roughness: 0.9 });
const road = new THREE.Mesh(roadGeo, roadMat);
road.rotation.x = -Math.PI / 2;
road.position.set(0, 0, -80);
road.receiveShadow = true;
scene.add(road);

// Road markings
for (let z = 0; z < 160; z += 4) {
  const markGeo = new THREE.PlaneGeometry(0.3, 2);
  const markMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
  const mark = new THREE.Mesh(markGeo, markMat);
  mark.rotation.x = -Math.PI / 2;
  mark.position.set(0, 0.02, -z);
  scene.add(mark);
}

// Road edge lines (neon)
for (let side of [-5, 5]) {
  for (let z = 0; z < 160; z += 8) {
    const edgeGeo = new THREE.PlaneGeometry(0.2, 3);
    const edgeMat = new THREE.MeshBasicMaterial({ color: 0xff2d95 });
    const edge = new THREE.Mesh(edgeGeo, edgeMat);
    edge.rotation.x = -Math.PI / 2;
    edge.position.set(side, 0.02, -z);
    scene.add(edge);
  }
}

// Billboard function
function createBillboard(text, x, z, color = 0x00f0ff) {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 256;
  const ctx = canvas.getContext('2d');
  
  ctx.fillStyle = '#06060f';
  ctx.fillRect(0, 0, 512, 256);
  ctx.strokeStyle = '#' + new THREE.Color(color).getHexString();
  ctx.lineWidth = 4;
  ctx.strokeRect(10, 10, 492, 236);
  
  ctx.fillStyle = '#' + new THREE.Color(color).getHexString();
  ctx.font = 'bold 28px "Courier New"';
  ctx.textAlign = 'center';
  
  const lines = text.split('\n');
  lines.forEach((line, i) => {
    ctx.fillText(line, 256, 100 + i * 35);
  });
  
  // Neon glow effect
  ctx.shadowColor = '#' + new THREE.Color(color).getHexString();
  ctx.shadowBlur = 20;
  ctx.fillText(lines[0], 256, 100);
  
  const tex = new THREE.CanvasTexture(canvas);
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
  const board = new THREE.Mesh(new THREE.PlaneGeometry(10, 5), mat);
  board.position.set(x, 5, z);
  board.userData = { type: 'billboard' };
  return board;
}

// Create zone billboards
const billboards = [
  createBillboard('CHAOS ZONE\nAI agents spending\nwith NO oversight', -7, -10, 0xff2d95),
  createBillboard('PASSPORT\nREQUIRED\nGoverned access', 7, -40, 0x00f0ff),
  createBillboard('COST TRACKER\nYour agent spent\nHOW MUCH?', -7, -70, 0xffb800),
  createBillboard('MEMORY LANE\nPersistent context\nacross sessions', 7, -100, 0x00f0ff),
  createBillboard('PROOF ZONE\nEvery action\nverified on-chain', -7, -130, 0xffb800),
];

billboards.forEach(b => scene.add(b));

// Decorative neon cubes along road
for (let i = 0; i < 40; i++) {
  const cubeGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
  const colors = [0x00f0ff, 0xff2d95, 0xffb800];
  const cubeMat = new THREE.MeshStandardMaterial({ 
    color: colors[i % 3], 
    emissive: colors[i % 3],
    emissiveIntensity: 0.5 
  });
  const cube = new THREE.Mesh(cubeGeo, cubeMat);
  cube.position.set(
    (Math.random() - 0.5) * 16,
    0.5 + Math.random() * 3,
    -i * 4 - Math.random() * 2
  );
  scene.add(cube);
}

// Particles
const particlesGeo = new THREE.BufferGeometry();
const particlesCount = 200;
const positions = new Float32Array(particlesCount * 3);
for (let i = 0; i < particlesCount; i++) {
  positions[i * 3] = (Math.random() - 0.5) * 30;
  positions[i * 3 + 1] = Math.random() * 15;
  positions[i * 3 + 2] = -Math.random() * 160;
}
particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
const particlesMat = new THREE.PointsMaterial({ 
  color: 0x00f0ff, 
  size: 0.1,
  transparent: true,
  opacity: 0.6
});
const particles = new THREE.Points(particlesGeo, particlesMat);
scene.add(particles);

// ============================================================
// GAME LOOP
// ============================================================
let speed = 0;
let targetSpeed = 0;
let currentMile = 0;
let isPlaying = false;
const BASE_SPEED = 0.15;
const MAX_SPEED = 0.6;

// DOM elements
const startScreen = document.getElementById('start-screen');
const speedVal = document.querySelector('#speedometer .val');
const mileVal = document.querySelector('#mile-marker .mile');
const zoneName = document.getElementById('zone-name');
const ctas = {
  costTracker: document.getElementById('cta-cost-tracker'),
  memory: document.getElementById('cta-memory'),
  proof: document.getElementById('cta-proof'),
  final: document.getElementById('cta-final')
};

const zones = [
  { mile: 0, name: '⬡ THE WILD WEST', message: 'AI agents are spending right now. Nobody is watching.' },
  { mile: 1, name: '🛂 CHECKPOINT', message: 'AgentPay passport required. Governed. Scoped. Auditable.' },
  { mile: 2, name: '💰 COST TRACKER', message: 'Track every token. Set budgets. Sleep better.' },
  { mile: 3, name: '🧠 MEMORY LANE', message: 'Persistent memory. No more "as an AI language model..."' },
  { mile: 4, name: '🔐 PROOF ZONE', message: 'Every action, cryptographically verified. SHA-256. Immutable.' },
  { mile: 5, name: '🚀 LAUNCHPAD', message: '61 products. Zero humans in the loop. Get your passport.' },
];

function updateHUD() {
  speedVal.textContent = Math.floor(speed * 200);
  mileVal.textContent = currentMile.toFixed(1);
  
  // Zone name
  const zone = zones.find(z => Math.abs(z.mile - currentMile) < 0.5);
  if (zone && zoneName.textContent !== zone.name) {
    zoneName.textContent = zone.name;
    zoneName.style.opacity = '1';
    setTimeout(() => { zoneName.style.opacity = '0'; }, 3000);
  }
  
  // Show CTAs near product zones
  const showCTA = (el, mile) => {
    const dist = Math.abs(currentMile - mile);
    el.style.display = dist < 0.6 ? 'block' : 'none';
  };
  showCTA(ctas.costTracker, 2);
  showCTA(ctas.memory, 3);
  showCTA(ctas.proof, 4);
  showCTA(ctas.final, 5);
  
  // Update global state
  window.AgentPayHighway.currentMile = currentMile;
  window.AgentPayHighway.speed = speed;
}

// Controls
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowUp' || e.key === 'w') targetSpeed = MAX_SPEED;
  if (e.key === 'ArrowDown' || e.key === 's') targetSpeed = BASE_SPEED * 0.3;
  if (e.key === 'ArrowRight' || e.key === 'd') camera.position.x = Math.min(camera.position.x + 0.3, 3);
  if (e.key === 'ArrowLeft' || e.key === 'a') camera.position.x = Math.max(camera.position.x - 0.3, -3);
});

document.addEventListener('keyup', () => {
  targetSpeed = BASE_SPEED;
});

// Touch controls
let touchActive = false;
document.addEventListener('touchstart', () => { touchActive = true; targetSpeed = MAX_SPEED; });
document.addEventListener('touchend', () => { touchActive = false; targetSpeed = BASE_SPEED; });

// Click to accelerate (desktop fallback)
document.addEventListener('click', (e) => {
  if (!isPlaying || e.target.tagName === 'A' || e.target.tagName === 'BUTTON') return;
  targetSpeed = MAX_SPEED;
  setTimeout(() => { if (!touchActive) targetSpeed = BASE_SPEED; }, 1000);
});

// Scroll wheel speed
document.addEventListener('wheel', (e) => {
  if (!isPlaying) return;
  targetSpeed = Math.max(0.05, Math.min(MAX_SPEED, targetSpeed - e.deltaY * 0.001));
});

function startGame() {
  startScreen.style.display = 'none';
  isPlaying = true;
  targetSpeed = BASE_SPEED;
  window.AgentPayHighway.isPlaying = true;
  document.body.style.cursor = 'none';
}

window.startGame = startGame;

// Audio
let audioOn = false;
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let oscNode = null;

function toggleAudio() {
  audioOn = !audioOn;
  document.getElementById('audio-toggle').textContent = audioOn ? '♪ ON' : '♪ OFF';
  if (audioOn) {
    if (!oscNode) {
      oscNode = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      gain.gain.value = 0.03;
      oscNode.type = 'sawtooth';
      oscNode.frequency.value = 80;
      oscNode.connect(gain);
      gain.connect(audioCtx.destination);
      oscNode.start();
    }
  } else if (oscNode) {
    oscNode.stop();
    oscNode = null;
  }
}
window.toggleAudio = toggleAudio;

function animate() {
  requestAnimationFrame(animate);
  
  if (isPlaying) {
    // Smooth speed transitions
    speed += (targetSpeed - speed) * 0.05;
    
    // Move camera forward
    camera.position.z -= speed;
    
    // Calculate mile
    currentMile = Math.abs(camera.position.z - 10) / 30;
    
    // Bounds
    if (currentMile > 5.2) {
      camera.position.z = -5.2 * 30 + 10;
      currentMile = 5.2;
      speed *= 0.3;
      targetSpeed = 0;
    }
    if (currentMile < 0) {
      camera.position.z = 10;
      currentMile = 0;
      speed = 0;
    }
    
    // Neon lights pulse
    neonLights.forEach((l, i) => {
      l.intensity = 1.5 + Math.sin(Date.now() * 0.003 + i) * 0.8;
    });
    
    // Particles drift
    const pos = particles.geometry.attributes.position.array;
    for (let i = 0; i < particlesCount; i++) {
      pos[i * 3 + 2] += speed * 0.5;
      if (pos[i * 3 + 2] > 20) pos[i * 3 + 2] = -150;
    }
    particles.geometry.attributes.position.needsUpdate = true;
    
    // Audio
    if (audioOn && oscNode) {
      oscNode.frequency.value = 60 + speed * 200 + Math.sin(currentMile * 2) * 30;
    }
    
    updateHUD();
  }
  
  // Always look forward
  camera.lookAt(camera.position.x, 2, camera.position.z - 30);
  
  renderer.render(scene, camera);
}

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Agent accessibility: expose controls globally
console.log('🛣️ AgentPay Highway v1.0.0-mvp');
console.log('👤 Humans: Press Enter or tap to drive. Arrow keys / WASD to control.');
console.log('🤖 Agents: window.AgentPayHighway.getState() or .jumpTo(mile)');
console.log('📊 Structured data: view-source for JSON-LD game zones');

animate();
</script>
</body>
</html>
